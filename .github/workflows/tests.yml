name: Tests

# Runs on every push to master and to the working-branch patterns, and on every
# pull request into master:
#
#   python  the whole pytest suite (tests/), then the data-provenance gate.
#           Includes tests/test_published_numbers.py, which recomputes the
#           headline figures the reports quote from committed data.
#   viewer  the site's vitest suite (viewer/tests/), including the gate on
#           retired figures in site copy.
#
# No path filter: a change to a report, a finding or the site can make a
# published number wrong just as a change to a script can.
#
# Environment: Python 3.13 with the full lock in requirements.txt (numpy,
# pandas and every other package pinned). Nothing is installed unpinned.
#
# Data. The canonical chains and the small outputs are ordinary git files. Four
# boundary and vote files that the data-backed tests read are Git LFS objects
# (about 54 MB). They are pulled by name and cached by their pointer hashes;
# the other LFS objects (well over 1 GB) are not pulled. Two tests in
# tests/test_pipeline_integration.py read the pooled raw-samples CSV, a 170 MB
# LFS object that is not pulled; they skip here and run in a full clone. If the
# pull fails, every test that needs an LFS file skips with a message naming the
# file, and the job prints a warning; nothing fails for want of data.
#
# Runtime of the suites themselves: pytest about 80 s and vitest about 4 s on a
# 2026-11-10 local run; the pip install comes on top.

on:
  push:
    branches:
      - master
      - "audit/**"
      - "gemini-audit"
      - "ccr-**"
      - "claude/**"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The LFS objects the data-backed tests read. Keep in step with the paths in
  # tests/test_published_numbers.py, tests/test_scoring.py and
  # tests/test_map_explorer_geojson.py.
  LFS_TEST_FILES: >-
    data/shapefiles/canonical/ea_majority_2026_eds.gpkg,data/shapefiles/canonical/ea_minority_2026_eds.gpkg,data/shapefiles/derived/va_polygons_with_2023_votes.gpkg,data/shapefiles/derived/va_polygons_all_2023_ballots_primary.gpkg

jobs:
  python:
    name: pytest (full suite) + provenance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # LFS objects are pulled selectively below, not all 1.5 GB of them.
          lfs: false

      - name: Key for the LFS cache
        id: lfs-key
        run: |
          echo "hash=$(git lfs ls-files -l -I "$LFS_TEST_FILES" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Restore cached LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-test-files-${{ steps.lfs-key.outputs.hash }}

      - name: Pull the LFS files the tests read
        # continue-on-error: with no LFS access the data-backed tests skip cleanly.
        continue-on-error: true
        run: |
          git lfs pull --include="$LFS_TEST_FILES" --exclude=""
          git lfs ls-files -I "$LFS_TEST_FILES"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        # The manylinux wheels bundle GEOS, GDAL and PROJ; no apt packages needed.
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install -r requirements.txt
          python -c "import numpy, pandas, scipy, geopandas, gerrychain; print('numpy', numpy.__version__, '| pandas', pandas.__version__, '| scipy', scipy.__version__, '| geopandas', geopandas.__version__, '| gerrychain', gerrychain.__version__)"

      - name: Run pytest (whole suite)
        # pipefail: without it the step takes tee's exit status and passes
        # even when tests fail.
        run: |
          set -o pipefail
          python -m pytest tests -ra --tb=short --durations=10 -p no:cacheprovider | tee pytest.log

      - name: Warn if data-backed tests were skipped
        if: always()
        run: |
          if grep -q "Git LFS pointer\|is not present" pytest.log 2>/dev/null; then
            echo "::warning::Some data-backed tests were skipped because their LFS files were not available. See the 'short test summary' in the pytest step."
          fi

      - name: Verify data provenance
        run: |
          python analysis/scripts/check_provenance.py --manifest data/provenance_manifest.json

  viewer:
    name: vitest (site)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test
