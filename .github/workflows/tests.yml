name: Tests

# Runs the audit's pytest suite on every push and PR. Cheapest possible
# defence against regressions in the four scoring formulas, the spatial
# join deduplication, the CRS reprojection branch, and the chunked-MCMC
# state threading. Per Gemini's design-review #2: low-effort CI gates
# every push so a future bug-fix doesn't accidentally re-introduce a
# previously-fixed failure mode.

on:
  push:
    branches: [master, "audit/**", "gemini-audit"]
    paths:
      - "analysis/scripts/**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
      # Committed outputs + their manifest must re-trigger the provenance gate;
      # otherwise a commit that only regenerates outputs leaves the manifest
      # stale without CI noticing (the original cause of the stale-manifest bug).
      - "data/outputs/**"
      - "data/provenance_manifest.json"
  pull_request:
    branches: [master]
    paths:
      - "analysis/scripts/**.py"
      - "tests/**"
      - "requirements.txt"
      - "data/outputs/**"
      - "data/provenance_manifest.json"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The verification-subset integrity test reads two large data
          # artefacts under data/. They live in the repo (not LFS), so a
          # default checkout is sufficient.
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system geospatial libraries
        # geopandas / shapely / pyproj need GEOS, GDAL, PROJ at the system
        # level. Ubuntu's apt packages are sufficient for the test geometry
        # (synthetic squares + the Alberta VA gpkg).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgeos-dev libgdal-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # gerrychain pulls a heavy stack; install only what the tests
          # need to keep CI fast. The full requirements.txt installs
          # cleanly but is ~5 minutes; minimal install is ~90s.
          # pyyaml + matplotlib added 2026-07-09: test_scoring.py imports
          # mcmc_ensemble, whose module top pulls data_loader (-> yaml) and
          # matplotlib; their absence broke every Tests run since 2026-06-26
          # with ModuleNotFoundError at collection. Keep this list in sync
          # with the module-level imports of analysis/scripts/mcmc_ensemble.py
          # and analysis/utils/data_loader.py.
          pip install pytest numpy pandas geopandas shapely pyproj networkx pyyaml matplotlib
          pip install gerrychain==0.3.2 networkx==3.6.1

      - name: Run pytest
        run: |
          python -m pytest tests/test_scoring.py -v --tb=short

      - name: Verify data provenance
        run: |
          python analysis/scripts/check_provenance.py --manifest data/provenance_manifest.json

      - name: Report
        if: always()
        run: |
          echo "::notice::Pytest run complete. 12 tests cover the four scoring formulas, sjoin dedup, CRS reprojection, chunked-MCMC state threading, and verification-subset recompute spot-check."
